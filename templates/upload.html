<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockSync AI - Upload Dataset</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="app-container">

    <aside class="sidebar">

        <div class="logo">
            StockSync AI
        </div>

        <ul class="nav-menu">
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/upload">Upload Dataset</a></li>
            <li><a href="/analysis">Inventory Analysis</a></li>
            <li><a href="/reports">Reports</a></li>
        </ul>

    </aside>

    <main class="main-content">

        <div class="page-header">

            <h1>Upload Dataset</h1>

            <p>
                Upload inventory, sales, and returns CSV files.
            </p>

        </div>

        <div class="card-grid">

            <div class="card">
                <h3>Inventory Dataset</h3>
                <input type="file" accept=".csv">
            </div>

            <div class="card">
                <h3>Sales Dataset</h3>
                <input type="file" accept=".csv">
            </div>

            <div class="card">
                <h3>Returns Dataset</h3>
                <input type="file" accept=".csv">
            </div>

        </div>

        <div class="placeholder">

            <h2>Dataset Status</h2>

            <p>
                No datasets uploaded yet.
            </p>

        </div>

    </main>

</div>

</body>
</html>
